# ===================================================================
# Starfit 生产部署编排（用户自部署引导包）
# 用法：cd 仓库根 && docker compose -f deploy/docker-compose.prod.yml up -d --build
# 环境变量统一从 deploy/.env（由 deploy/.env.example 复制而来）注入：
#   - 敏感变量一律走 env_file（compose 的 environment 段 ${VAR} 空插值
#     会覆盖 env_file 真值，见 Phase 3 实测，故此处不留任何空插值传递）；
#   - environment 段只放非敏感的固定/拼接值。
# ===================================================================
name: starfit

services:
  postgres:
    image: postgres:16-alpine
    # 项目未使用 pgvector（backend/src 无 vector/embedding 引用），维持官方镜像
    env_file:
      - ./.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 迁移脚本（002/003）依赖 uuid-ossp 扩展，首次建库时自动安装
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-uuid-ossp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-starfit} -d $${POSTGRES_DB:-starfit}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      # context 必须是仓库根（monorepo：backend 依赖 workspace shared）
      context: ..
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      # 非敏感固定值（容器内监听由 compose 强制，不依赖 .env）
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=43111
    ports:
      # 宿主端口可通过 .env 的 STARFIT_PORT 覆盖（默认 43111）
      - "${STARFIT_PORT:-43111}:43111"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      # 设了 STARFIT_ACCESS_TOKEN 时 /api/ping 也走鉴权，健康检查须自带令牌
      # （$$ 转义使变量在容器内展开，读 env_file 注入的真值）
      test: ["CMD-SHELL", "wget -qO- --header \"X-Access-Token: $$STARFIT_ACCESS_TOKEN\" http://127.0.0.1:43111/api/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # 一次性数据库迁移：建表 + 增量迁移（001..009），跑完即退出。
  # 首次部署或 schema 变更后手动执行：
  #   docker compose -f deploy/docker-compose.prod.yml --profile tools run --rm migrate
  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: builder
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    working_dir: /app
    # MigrationRunner 以「仓库根 + backend/src/...」定位迁移目录，故工作目录必须是 /app。
    # 两段式：①postgres-init 幂等建基线 schema（users/exercises 等 14 表，已初始化则跳过）
    # ②run.ts 跑增量迁移（001..009）。基线表不在 SQL 迁移里，漏掉①会导致 002 因
    # 「relation users does not exist」失败。
    command:
      - sh
      - -c
      - |
        printf '%s\n' \
          "import pg from '/app/node_modules/pg/lib/index.js';" \
          "const { initializeDatabase } = await import('/app/backend/src/db/postgresql/client/postgres-init.ts');" \
          "await initializeDatabase();" \
          "const client = new pg.Client({ connectionString: process.env.DATABASE_URL });" \
          "await client.connect();" \
          "await client.query('DROP VIEW IF EXISTS user_insights');" \
          "await client.end();" \
          > /tmp/init.mjs \
          && cd /app/backend/src/db/postgresql/client && npx tsx /tmp/init.mjs \
          && cd /app && npx tsx --eval "import('/app/backend/src/db/postgresql/migrations/run.ts').then(() => process.exit(0)).catch(() => process.exit(1))"
    restart: "no"

  # 可选反向代理网关（默认不启动）。需要时：
  #   docker compose -f deploy/docker-compose.prod.yml --profile web up -d
  nginx:
    image: nginx:1.25-alpine
    profiles: ["web"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ../backend/infra/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
