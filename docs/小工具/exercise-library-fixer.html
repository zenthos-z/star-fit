<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运动库自动补全修正工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .card-shadow {
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .exercise-card {
            transition: all 0.3s ease;
        }
        
        .exercise-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        
        .issue-tag {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .status-badge {
            transition: all 0.3s ease;
        }
        
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .field-item {
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
        }
        
        .field-item.issue {
            border-left-color: #ef4444;
            background-color: #fef2f2;
        }
        
        .field-item.fixed {
            border-left-color: #22c55e;
            background-color: #f0fdf4;
        }
        
        textarea, input {
            font-size: 14px;
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .provider-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
        
        .markdown-content {
            font-size: 14px;
            line-height: 1.6;
        }
        
        .markdown-content h1 {
            font-size: 1.5em;
            font-weight: bold;
            margin: 1em 0 0.5em 0;
            color: #1f2937;
        }
        
        .markdown-content h2 {
            font-size: 1.25em;
            font-weight: bold;
            margin: 0.8em 0 0.5em 0;
            color: #374151;
            padding-bottom: 0.3em;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .markdown-content h3 {
            font-size: 1.1em;
            font-weight: 600;
            margin: 0.6em 0 0.4em 0;
            color: #4b5563;
        }
        
        .markdown-content p {
            margin: 0.5em 0;
            color: #374151;
        }
        
        .markdown-content ul, .markdown-content ol {
            margin: 0.5em 0;
            padding-left: 1.5em;
            color: #374151;
        }
        
        .markdown-content li {
            margin: 0.3em 0;
        }
        
        .markdown-content code {
            background-color: #f3f4f6;
            padding: 0.1em 0.3em;
            border-radius: 0.25em;
            font-size: 0.9em;
            color: #dc2626;
        }
        
        .markdown-content pre {
            background-color: #1f2937;
            color: #e5e7eb;
            padding: 1em;
            border-radius: 0.5em;
            overflow-x: auto;
            margin: 0.5em 0;
        }
        
        .markdown-content pre code {
            background-color: transparent;
            color: inherit;
            padding: 0;
        }
        
        .markdown-content strong {
            font-weight: 600;
            color: #1f2937;
        }
        
        .markdown-content em {
            font-style: italic;
        }
        
        .markdown-content blockquote {
            border-left: 4px solid #667eea;
            padding-left: 1em;
            margin: 0.5em 0;
            color: #6b7280;
        }
        
        .markdown-content a {
            color: #667eea;
            text-decoration: underline;
        }
        
        .markdown-content a:hover {
            color: #764ba2;
        }
        
        .markdown-content hr {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 1em 0;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">
                <i class="fas fa-dumbbell text-purple-600 mr-3"></i>
                运动库自动补全修正工具
            </h1>
            <p class="text-gray-600">上传运动库ZIP文件，AI自动识别并修复缺失或错误的信息</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white rounded-xl p-6 card-shadow">
                    <h2 class="text-lg font-semibold mb-4 flex items-center justify-between">
                        <div class="flex items-center">
                            <i class="fas fa-cog text-purple-600 mr-2"></i>
                            配置
                        </div>
                        <div class="flex gap-2">
                            <button onclick="exportConfig()" class="text-sm px-3 py-1 bg-purple-100 hover:bg-purple-200 text-purple-700 rounded-lg transition-colors" title="导出配置">
                                <i class="fas fa-download mr-1"></i>导出
                            </button>
                            <label class="text-sm px-3 py-1 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-lg transition-colors cursor-pointer" title="导入配置">
                                <i class="fas fa-upload mr-1"></i>导入
                                <input type="file" id="importConfigFile" accept=".json" class="hidden" onchange="importConfig(event)">
                            </label>
                        </div>
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">AI提供商</label>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="selectProvider('openai')" class="provider-btn active px-4 py-2 border-2 border-gray-300 rounded-lg transition-all" data-provider="openai">
                                    <i class="fas fa-brain mr-1"></i>OpenAI
                                </button>
                                <button onclick="selectProvider('gemini')" class="provider-btn px-4 py-2 border-2 border-gray-300 rounded-lg transition-all" data-provider="gemini">
                                    <i class="fas fa-gem mr-1"></i>Gemini
                                </button>
                                <button onclick="selectProvider('openrouter')" class="provider-btn px-4 py-2 border-2 border-gray-300 rounded-lg transition-all" data-provider="openrouter">
                                    <i class="fas fa-route mr-1"></i>OpenRouter
                                </button>
                            </div>
                        </div>
                        
                        <div id="openaiConfig">
                            <div class="mb-3">
                                <label class="block text-sm font-medium text-gray-700 mb-2">OpenAI API Key</label>
                                <input type="password" id="openaiApiKey" placeholder="sk-..." 
                                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                       onblur="saveConfigToCache()">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">模型</label>
                                <select id="openaiModel" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                                        onchange="saveConfigToCache()">
                                    <option value="gpt-5.2" selected>GPT-5.2</option>
                                    <option value="gpt-5.2-thinking">GPT-5.2 Thinking</option>
                                    <option value="gpt-5.1">GPT-5.1</option>
                                    <option value="gpt-5.1-codex-max">GPT-5.1 Codex Max</option>
                                    <option value="gpt-4.1">GPT-4.1</option>
                                    <option value="gpt-4.1-mini">GPT-4.1 Mini</option>
                                    <option value="gpt-4.1-nano">GPT-4.1 Nano</option>
                                    <option value="gpt-4o">GPT-4o (已废弃)</option>
                                </select>
                            </div>
                        </div>
                        
                        <div id="geminiConfig" class="hidden">
                            <div class="mb-3">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Gemini API Key</label>
                                <input type="password" id="geminiApiKey" placeholder="AIza..." 
                                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                       onblur="saveConfigToCache()">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">模型</label>
                                <select id="geminiModel" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
                                        onchange="saveConfigToCache()">
                                    <option value="gemini-3-pro" selected>Gemini 3 Pro</option>
                                    <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                                    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                                    <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash (已废弃)</option>
                                    <option value="gemini-2.0-flash-lite-exp">Gemini 2.0 Flash Lite (已废弃)</option>
                                    <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                                    <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                                </select>
                            </div>
                        </div>
                        
                        <div id="openrouterConfig" class="hidden">
                            <div class="mb-3">
                                <label class="block text-sm font-medium text-gray-700 mb-2">OpenRouter API Key</label>
                                <input type="password" id="openrouterApiKey" placeholder="sk-or-..." 
                                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                       onblur="saveConfigToCache()">
                            </div>
                            
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">模型</label>
                                    <input type="text" id="openrouterModel" placeholder="例如: anthropic/claude-3.5-sonnet" 
                                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                           value="anthropic/claude-3.5-sonnet"
                                           onblur="saveConfigToCache()">
                                </div>
                                
                                <div class="border-t border-gray-200 pt-3 mt-3">
                                    <h4 class="text-sm font-medium text-gray-700 mb-2">
                                        <i class="fas fa-image mr-1"></i>生图设置
                                    </h4>
                                    <div class="space-y-2">
                                        <label class="flex items-center space-x-2 cursor-pointer">
                                            <input type="checkbox" id="enableImageGen" onchange="saveConfigToCache()" class="w-4 h-4 text-purple-600 rounded focus:ring-purple-500">
                                            <span class="text-sm text-gray-700">启用封面生成</span>
                                        </label>
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-1">生图模型ID</label>
                                            <input type="text" id="imageGenModel" placeholder="例如: stabilityai/stable-diffusion-xl" 
                                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent text-sm"
                                                   value="stabilityai/stable-diffusion-xl"
                                                   onblur="saveConfigToCache()">
                                            <p class="text-xs text-gray-500 mt-1">
                                                <i class="fas fa-info-circle mr-1"></i>使用 OpenRouter 的生图模型API
                                            </p>
                                        </div>
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">常用模型（点击选择）</label>
                                    <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
                                        <button onclick="selectOpenRouterModel('anthropic/claude-3.5-sonnet')" 
                                                class="text-xs px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded transition-colors">
                                            Claude 3.5 Sonnet
                                        </button>
                                        <button onclick="selectOpenRouterModel('anthropic/claude-3.5-sonnet:beta')" 
                                                class="text-xs px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded transition-colors">
                                            Claude 3.5 Beta
                                        </button>
                                        <button onclick="selectOpenRouterModel('anthropic/claude-3.5-sonnet:thinking')" 
                                                class="text-xs px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded transition-colors">
                                            Claude 3.5 Thinking
                                        </button>
                                        <button onclick="selectOpenRouterModel('anthropic/claude-3-opus')" 
                                                class="text-xs px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded transition-colors">
                                            Claude 3 Opus
                                        </button>
                                        <button onclick="selectOpenRouterModel('anthropic/claude-3-haiku')" 
                                                class="text-xs px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded transition-colors">
                                            Claude 3 Haiku
                                        </button>
                                        <button onclick="selectOpenRouterModel('openai/gpt-5.2')" 
                                                class="text-xs px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded transition-colors">
                                            GPT-5.2
                                        </button>
                                        <button onclick="selectOpenRouterModel('openai/gpt-5.1')" 
                                                class="text-xs px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded transition-colors">
                                            GPT-5.1
                                        </button>
                                        <button onclick="selectOpenRouterModel('openai/gpt-4.1')" 
                                                class="text-xs px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded transition-colors">
                                            GPT-4.1
                                        </button>
                                        <button onclick="selectOpenRouterModel('google/gemini-2.5-flash')" 
                                                class="text-xs px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded transition-colors">
                                            Gemini 2.5 Flash
                                        </button>
                                        <button onclick="selectOpenRouterModel('deepseek/deepseek-chat')" 
                                                class="text-xs px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded transition-colors">
                                            DeepSeek Chat
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="bg-white rounded-xl card-shadow overflow-hidden">
                            <button onclick="togglePromptPanel()" class="w-full p-4 flex items-center justify-between hover:bg-gray-50 transition-colors">
                                <div class="flex items-center">
                                    <i class="fas fa-edit text-orange-600 mr-2"></i>
                                    <h2 class="text-lg font-semibold">自定义提示词</h2>
                                </div>
                                <i class="fas fa-chevron-down text-gray-400 transition-transform" id="promptPanelChevron"></i>
                            </button>
                            
                            <div id="promptPanelContent" class="hidden border-t border-gray-200">
                                <div class="p-4 space-y-3">
                                    <div class="flex items-center justify-between">
                                        <label class="block text-sm font-medium text-gray-700">教程生成自定义提示词（可选）</label>
                                        <button onclick="resetToDefaultPrompt()" class="text-sm text-blue-600 hover:text-blue-800">
                                            <i class="fas fa-undo mr-1"></i>
                                            恢复默认
                                        </button>
                                    </div>
                                    <textarea id="custom-prompt" rows="10" 
                                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm font-mono resize-y"
                                        onblur="saveConfigToCache()"
                                        placeholder="留空使用默认提示词，或输入自定义提示词来自定义教程生成..."></textarea>
                                    <p class="text-xs text-gray-500">
                                        <i class="fas fa-info-circle mr-1"></i>
                                        此提示词仅用于生成教程，不影响其他参数（分类、肌肉群、难度等）的修复。
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl p-6 card-shadow">
                    <h2 class="text-lg font-semibold mb-4 flex items-center">
                        <i class="fas fa-plus text-purple-600 mr-2"></i>
                        添加动作
                    </h2>
                    
                    <div class="space-y-3">
                        <button onclick="showAddExerciseModal()"
                                class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                            <i class="fas fa-plus mr-2"></i>
                            新建动作
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-xl p-6 card-shadow">
                    <h2 class="text-lg font-semibold mb-4 flex items-center">
                        <i class="fas fa-upload text-purple-600 mr-2"></i>
                        导入数据
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">上传ZIP文件</label>
                            <input type="file" id="zipFile" accept=".zip" 
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                            <p class="text-xs text-gray-500 mt-1">支持包含exercise*.json的ZIP文件</p>
                        </div>
                        
                        <button onclick="loadFile()" id="loadBtn"
                                class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                            <i class="fas fa-file-import mr-2"></i>
                            加载文件
                        </button>
                        
                        <div id="fileInfo" class="hidden bg-gray-50 rounded-lg p-3 text-sm">
                            <p class="font-medium text-gray-700" id="fileName"></p>
                            <p class="text-gray-500" id="exerciseCount"></p>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl p-6 card-shadow">
                    <h2 class="text-lg font-semibold mb-4 flex items-center">
                        <i class="fas fa-magic text-purple-600 mr-2"></i>
                        自动修复
                    </h2>
                    
                    <div class="space-y-3">
                        <button onclick="scanIssues()" id="scanBtn"
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors">
                            <i class="fas fa-search mr-2"></i>
                            扫描问题
                        </button>
                        
                        <button onclick="autoFix()" id="fixBtn" disabled
                                class="w-full bg-green-600 hover:bg-green-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-medium py-2 px-4 rounded-lg transition-colors">
                            <i class="fas fa-wand-magic-sparkles mr-2"></i>
                            自动修复
                        </button>
                        
                        <button onclick="exportFixed()" id="exportBtn" disabled
                                class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-medium py-2 px-4 rounded-lg transition-colors">
                            <i class="fas fa-download mr-2"></i>
                            导出数据
                        </button>
                    </div>
                </div>
            </div>

            <div id="progressModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
                <div class="bg-white rounded-xl p-6 max-w-md w-full mx-4 shadow-xl">
                    <div class="text-center">
                        <div class="mb-4">
                            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent"></div>
                        </div>
                        <h3 id="progressTitle" class="text-lg font-semibold mb-2">处理中...</h3>
                        <p id="progressMessage" class="text-gray-600 text-sm mb-4">请稍候</p>
                        <div id="progressBarContainer" class="w-full bg-gray-200 rounded-full h-2 mb-4 hidden">
                            <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                        <p id="progressDetail" class="text-xs text-gray-500"></p>
                    </div>
                </div>
            </div>

            <div id="addExerciseModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
                <div class="bg-white rounded-xl p-6 max-w-2xl w-full mx-4 shadow-xl max-h-[90vh] overflow-y-auto">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-semibold">添加新动作</h3>
                        <button onclick="hideAddExerciseModal()" class="text-gray-400 hover:text-gray-600">
                            <i class="fas fa-times text-xl"></i>
                        </button>
                    </div>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">动作名称 *</label>
                            <input type="text" id="newExerciseName" placeholder="例如：卧推"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">分类 *</label>
                                <select id="newExerciseCategory" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                                    <option value="力量训练">力量训练</option>
                                    <option value="有氧运动">有氧运动</option>
                                    <option value="柔韧性">柔韧性</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">运动类型 *</label>
                                <select id="newExerciseType" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                                    <option value="resistance">resistance</option>
                                    <option value="cardio">cardio</option>
                                    <option value="isometric">isometric</option>
                                    <option value="assisted">assisted</option>
                                </select>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">身体部位 *</label>
                            <select id="newExerciseBodyCategory" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                                <option value="胸部">胸部</option>
                                <option value="肩部">肩部</option>
                                <option value="手臂">手臂</option>
                                <option value="背部">背部</option>
                                <option value="核心">核心</option>
                                <option value="腿部">腿部</option>
                                <option value="臀部">臀部</option>
                                <option value="全身">全身</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">主要肌肉群 *</label>
                            <select id="newExercisePrimaryMuscle" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">

        const STANDARD_MUSCLE_GROUPS = [
            '上胸', '中下胸', '背部', '下背', '斜方肌',
            '三头', '二头', '后束', '中束', '前束', '小臂',
            '侧腹', '腹肌',
            '小腿', '上臀部', '下臀部', '腘绳', '股四'
        ];
        
        const MUSCLE_GROUP_ALIASES = {
            '胸': '中下胸',
            '胸肌': '中下胸',
            '胸大肌': '中下胸',
            '背': '背部',
            '背肌': '背部',
            '三角肌前束': '前束',
            '三角肌中束': '中束',
            '三角肌后束': '后束',
            '内侧二头': '二头',
            '外侧二头': '二头',
            '二头肌': '二头',
            '三头肌': '三头',
            '肱二头肌': '二头',
            '三头肌': '三头',
            '肱三头肌': '三头',
            '大腿': '股四',
            '股四头肌': '股四',
            '腿': '股四',
            '臀': '上臀部',
            '臀部': '上臀部',
            '腘绳肌': '腘绳',
            '小腿肌': '小腿',
            '腹': '腹肌',
            '腹直肌': '腹肌',
            '腹外斜肌': '侧腹'
        };
        
        function normalizeMuscleGroup(input) {
            const trimmed = input.trim();
            
            if (STANDARD_MUSCLE_GROUPS.includes(trimmed)) {
                return trimmed;
            }
            
            const mapped = MUSCLE_GROUP_ALIASES[trimmed];
            if (mapped) {
                return mapped;
            }
            
            for (const [alias, standard] of Object.entries(MUSCLE_GROUP_ALIASES)) {
                if (trimmed.includes(alias) || alias.includes(trimmed)) {
                    return standard;
                }
            }
            
            return trimmed;
        }
        
        function normalizeExerciseData(exerciseData) {
            return exerciseData.map(exercise => {
                const normalized = { ...exercise };
                
                try {
                    if (exercise.targets && typeof exercise.targets === 'string') {
                        const targets = JSON.parse(exercise.targets);
                        normalized.muscle_groups = {
                            primary: (targets.primary || []).map(normalizeMuscleGroup),
                            secondary: (targets.secondary || []).map(normalizeMuscleGroup),
                            stabilizers: (targets.stabilizers || []).map(normalizeMuscleGroup)
                        };
                    } else if (exercise.muscle_groups) {
                        normalized.muscle_groups = {
                            primary: (exercise.muscle_groups.primary || []).map(normalizeMuscleGroup),
                            secondary: (exercise.muscle_groups.secondary || []).map(normalizeMuscleGroup),
                            stabilizers: (exercise.muscle_groups.stabilizers || []).map(normalizeMuscleGroup)
                        };
                    } else {
                        normalized.muscle_groups = { primary: [], secondary: [], stabilizers: [] };
                    }
                } catch (e) {
                    console.warn('解析targets失败:', exercise.id, e);
                    normalized.muscle_groups = { primary: [], secondary: [], stabilizers: [] };
                }
                
                try {
                    if (exercise.equipment_required && typeof exercise.equipment_required === 'string') {
                        normalized.equipment_required = JSON.parse(exercise.equipment_required);
                    } else if (!exercise.equipment_required) {
                        normalized.equipment_required = [];
                    }
                } catch (e) {
                    console.warn('解析equipment_required失败:', exercise.id, e);
                    normalized.equipment_required = [];
                }
                
                try {
                    if (exercise.assets_json && typeof exercise.assets_json === 'string') {
                        normalized.assets = JSON.parse(exercise.assets_json);
                    } else if (exercise.assets) {
                        normalized.assets = exercise.assets;
                    } else {
                        normalized.assets = {};
                    }
                } catch (e) {
                    console.warn('解析assets_json失败:', exercise.id, e);
                    normalized.assets = {};
                }
                
                try {
                    if (exercise.tags_json && typeof exercise.tags_json === 'string') {
                        normalized.tags = JSON.parse(exercise.tags_json);
                    } else if (exercise.tags) {
                        normalized.tags = exercise.tags;
                    } else {
                        normalized.tags = [];
                    }
                } catch (e) {
                    console.warn('解析tags_json失败:', exercise.id, e);
                    normalized.tags = [];
                }
                
                if (!normalized.category) {
                    if (normalized.exercise_type === 'resistance') {
                        normalized.category = '力量训练';
                    } else if (normalized.exercise_type === 'cardio') {
                        normalized.category = '有氧运动';
                    } else if (normalized.exercise_type === 'flexibility') {
                        normalized.category = '柔韧性';
                    } else {
                        normalized.category = '其他';
                    }
                }
                
                if (!normalized.body_category) {
                    if (normalized.muscle_groups.primary && normalized.muscle_groups.primary.length > 0) {
                        const primaryMuscle = normalized.muscle_groups.primary[0];
                        
                        if (['上胸', '中下胸', '背部', '下背', '斜方肌'].includes(primaryMuscle)) {
                            normalized.body_category = '胸部';
                        } else if (['前束', '中束', '后束'].includes(primaryMuscle)) {
                            normalized.body_category = '肩部';
                        } else if (['二头', '三头', '小臂'].includes(primaryMuscle)) {
                            normalized.body_category = '手臂';
                        } else if (['腹肌', '侧腹'].includes(primaryMuscle)) {
                            normalized.body_category = '核心';
                        } else if (['股四', '腘绳', '小腿'].includes(primaryMuscle)) {
                            normalized.body_category = '腿部';
                        } else if (['上臀部', '下臀部'].includes(primaryMuscle)) {
                            normalized.body_category = '臀部';
                        } else {
                            normalized.body_category = '全身';
                        }
                    } else {
                        normalized.body_category = '全身';
                    }
                }
                
                return normalized;
            });
        }
        
        async function loadFile() {
            const fileInput = document.getElementById('zipFile');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('请选择ZIP文件');
                return;
            }
            
            const loadBtn = document.getElementById('loadBtn');
            loadBtn.innerHTML = '<div class="loading-spinner inline-block mr-2"></div>加载中...';
            loadBtn.disabled = true;
            
            try {
                const zip = new JSZip();
                const contents = await zip.loadAsync(file);
                
                let exerciseData = null;
                
                for (const filename of Object.keys(contents.files)) {
                    if (filename.match(/exercise.*\.json$/i)) {
                        const content = await contents.files[filename].async('string');
                        const json = JSON.parse(content);
                        
                        if (json.json && Array.isArray(json.json)) {
                            exerciseData = json.json;
                        } else if (Array.isArray(json)) {
                            exerciseData = json;
                        }
                        break;
                    }
                }
                
                if (!exerciseData) {
                    alert('未找到运动库数据文件');
                    loadBtn.innerHTML = '<i class="fas fa-file-import mr-2"></i>加载文件';
                    loadBtn.disabled = false;
                    return;
                }
                
                exercises = normalizeExerciseData(exerciseData);
                exerciseIssues = {};
                
                document.getElementById('fileInfo').classList.remove('hidden');
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('exerciseCount').textContent = `包含 ${exercises.length} 个运动`;
                
                updateStats();
                renderExerciseList();
                
                await scanIssues(true);
                
                loadBtn.innerHTML = '<i class="fas fa-file-import mr-2"></i>加载文件';
                loadBtn.disabled = false;
                
            } catch (error) {
                console.error('加载文件失败:', error);
                alert('加载文件失败: ' + error.message);
                loadBtn.innerHTML = '<i class="fas fa-file-import mr-2"></i>加载文件';
                loadBtn.disabled = false;
            }
        }
        
        function analyzeExercise(exercise) {
            const issues = [];
            
            if (!exercise.name || exercise.name.trim() === '') {
                issues.push({ field: 'name', message: '运动名称为空' });
            }
            
            if (exercise.name && (exercise.name.includes('-E2E') || exercise.name.includes('-test') || exercise.name.includes('testttt'))) {
                issues.push({ field: 'name', message: '名称包含测试标记' });
            }
            
            if (!exercise.category || exercise.category === null || exercise.category === '其他') {
                issues.push({ field: 'category', message: '分类为空或需要修正' });
            }
            
            if (!exercise.content_html || exercise.content_html === null || exercise.content_html.trim() === '') {
                issues.push({ field: 'content_html', message: '内容描述为空' });
            }
            
            if (!exercise.exercise_type) {
                issues.push({ field: 'exercise_type', message: '运动类型为空' });
            }
            
            if (!exercise.body_category || exercise.body_category === '全身') {
                issues.push({ field: 'body_category', message: '身体分类为空或需要修正' });
            }
            
            if (!exercise.muscle_groups || 
                !exercise.muscle_groups.primary || 
                exercise.muscle_groups.primary.length === 0) {
                issues.push({ field: 'muscle_groups', message: '肌肉群信息缺失' });
            }
            
            if (!exercise.equipment_required || exercise.equipment_required.length === 0) {
                issues.push({ field: 'equipment_required', message: '设备要求为空' });
            }
            
            if (!exercise.difficulty) {
                issues.push({ field: 'difficulty', message: '难度为空' });
            }
            
            return issues;
        }
        
        async function scanIssues(skipAlert = false) {
            if (exercises.length === 0) {
                if (!skipAlert) alert('请先加载运动库数据');
                return;
            }
            
            const scanBtn = document.getElementById('scanBtn');
            scanBtn.innerHTML = '<div class="loading-spinner inline-block mr-2"></div>扫描中...';
            scanBtn.disabled = true;
            
            exerciseIssues = {};
            
            for (const exercise of exercises) {
                const issues = analyzeExercise(exercise);
                if (issues.length > 0) {
                    exerciseIssues[exercise.id] = issues;
                }
            }
            
            updateStats();
            renderExerciseList();
            
            scanBtn.innerHTML = '<i class="fas fa-search mr-2"></i>扫描问题';
            scanBtn.disabled = false;
            
            document.getElementById('fixBtn').disabled = Object.keys(exerciseIssues).length === 0;
        }
        
        async function callOpenAI(apiKey, model, prompt) {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: [
                        {
                            role: 'system',
                            content: '你是一个专业的健身运动数据修正专家，擅长识别和修正运动信息。'
                        },
                        {
                            role: 'user',
                            content: prompt
                        }
                    ],
                    temperature: 0.3
                })
            });
            
            if (!response.ok) {
                throw new Error(`OpenAI API调用失败: ${response.status}`);
            }
            
            const data = await response.json();
            return data.choices[0].message.content;
        }

            let content;

        async function autoFix() {
            const config = getAPIConfig();
            
            if (!config.apiKey) {
                alert('请先配置API Key');
                return;
            }
            
            const issueIds = Object.keys(exerciseIssues);
            
            if (issueIds.length === 0) {
                alert('没有需要修复的运动');
                return;
            }
            
            const fixBtn = document.getElementById('fixBtn');
            fixBtn.innerHTML = '<div class="loading-spinner inline-block mr-2"></div>修复中...';
            fixBtn.disabled = true;
            
            let fixedCount = 0;
            let failedCount = 0;
            
            const enableImageGen = document.getElementById('enableImageGen').checked;
            const stepsPerExercise = enableImageGen ? 3 : 2;
            const totalSteps = issueIds.length * stepsPerExercise;
            const progressState = showProgress('自动修复中...', '正在修复运动数据', true, totalSteps);
            
            const customPrompt = document.getElementById('custom-prompt').value.trim();
            const finalPrompt = customPrompt || DEFAULT_TUTORIAL_PROMPT;
            
            try {
                for (let i = 0; i < issueIds.length; i++) {
                    const id = issueIds[i];
                    const exercise = exercises.find(e => e.id === id);
                    const issues = exerciseIssues[id];
                    
                    try {
                        const stepOffset = i * stepsPerExercise;
                        updateProgress(progressState, stepOffset + 1, `正在修复: ${exercise.name} 的数据...`);
                        
                        const fixedData = await callAI(exercise, issues);
                        
                        for (const [key, value] of Object.entries(fixedData)) {
                            if (value !== null && value !== undefined && value !== '') {
                                if (key === 'muscle_groups' && typeof value === 'object') {
                                    exercise[key] = {
                                        primary: (value.primary || []).map(normalizeMuscleGroup),
                                        secondary: (value.secondary || []).map(normalizeMuscleGroup),
                                        stabilizers: (value.stabilizers || []).map(normalizeMuscleGroup)
                                    };
                                } else {
                                    exercise[key] = value;
                                }
                            }
                        }
                        
                        delete exerciseIssues[id];
                        
                        updateProgress(progressState, stepOffset + 2, `正在生成: ${exercise.name} 的教程...`);
                        
                        const promptWithName = finalPrompt.replace('{动作名称}', exercise.name);
                        const tutorial = await generateTutorial(exercise, promptWithName);
                        exercise.tutorial_html = tutorial;
                        
                        if (enableImageGen) {
                            updateProgress(progressState, stepOffset + 3, `正在生成: ${exercise.name} 的封面图...`);
                            
                            const imageUrl = await generateCoverImage(exercise);
                            if (imageUrl) {
                                exercise.assets = exercise.assets || {};
                                exercise.assets.cover_image = imageUrl;
                                console.log(`[autoFix] Generated cover for ${exercise.name}: ${imageUrl}`);
                            }
                        }
                        
                        fixedCount++;
                        
                    } catch (error) {
                        console.error(`修复 ${id} 失败:`, error);
                        failedCount++;
                    }
                    
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
            } finally {
                hideProgress();
            }
            
            updateStats();
            renderExerciseList();
            
            fixBtn.innerHTML = '<i class="fas fa-wand-magic-sparkles mr-2"></i>自动修复';
            fixBtn.disabled = false;
            
            document.getElementById('exportBtn').disabled = false;
            
            showCompletionMessage('修复完成', `成功: ${fixedCount}，失败: ${failedCount}`);
        }

        function updateProgress(state, current, detail = '') {

                const percentage = Math.round((current / state.total) * 100);
                document.getElementById('progressBar').style.width = `${percentage}%`;
            }
            document.getElementById('progressDetail').textContent = detail;
        }
        
        function showCompletionMessage(title, message, duration = 3000) {
            const modal = document.getElementById('progressModal');
            document.getElementById('progressTitle').textContent = title;
            document.getElementById('progressMessage').textContent = message;
            document.getElementById('progressBarContainer').classList.add('hidden');
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressDetail').textContent = '';
            modal.classList.remove('hidden');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, duration);
        }
        
        function hideProgress() {
            document.getElementById('progressModal').classList.add('hidden');
        }
        
        function exportFixed() {
            const exportData = exercises.map(exercise => {
                const exported = { ...exercise };
                
                if (exercise.muscle_groups) {
                    exported.targets = JSON.stringify(exercise.muscle_groups);
                }
                
                if (exercise.equipment_required) {
                    exported.equipment_required = JSON.stringify(exercise.equipment_required);
                }
                
                if (exercise.assets) {
                    exported.assets_json = JSON.stringify(exercise.assets);
                }
                
                if (exercise.tags) {
                    exported.tags_json = JSON.stringify(exercise.tags);
                }
                
                if (exercise.tutorial_html) {
                    exported.tutorial_html = exercise.tutorial_html;
                }
                
                delete exported.muscle_groups;
                delete exported.assets;
                delete exported.tags;
                
                return exported;
            });
            
            const finalData = {
                generated_at: new Date().toISOString(),
                total_count: exportData.length,
                fixed_count: exportData.length - Object.keys(exerciseIssues).length,
                json: exportData
            };
            
            const blob = new Blob([JSON.stringify(finalData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `exercises_fixed_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function updateStats() {
            const total = exercises.length;
            const issues = Object.keys(exerciseIssues).length;
            const fixed = total - issues;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('issueCount').textContent = issues;
            document.getElementById('fixedCount').textContent = fixed;
        }
        
        function filterExercises(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.filter === filter) {
                    btn.classList.add('active');
                }
            });
            
            renderExerciseList();
        }
        
        function renderExerciseList() {
            const container = document.getElementById('exerciseList');
            
            if (exercises.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fas fa-inbox text-4xl mb-4"></i>
                        <p>请上传ZIP文件开始使用</p>
                    </div>
                `;
                return;
            }
            
            let filteredExercises = exercises;
            
            if (currentFilter === 'issues') {
                filteredExercises = exercises.filter(e => exerciseIssues[e.id]);
            } else if (currentFilter === 'fixed') {
                filteredExercises = exercises.filter(e => !exerciseIssues[e.id]);
            }
            
            if (filteredExercises.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fas fa-check-circle text-4xl mb-4"></i>
                        <p>没有${currentFilter === 'issues' ? '有问题' : '已修复'}的运动</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filteredExercises.map((exercise, index) => {
                const issues = exerciseIssues[exercise.id];
                const hasIssues = !!issues;
                const hasTutorial = exercise.tutorial_html;
                const coverImage = exercise.assets?.cover_image;
                
                return `
                    <div class="exercise-card bg-white border ${hasIssues ? 'border-red-300' : 'border-green-300'} rounded-lg overflow-hidden" data-exercise-id="${exercise.id}">
                        ${coverImage ? `
                            <div class="w-full h-48 bg-gray-100 flex items-center justify-center overflow-hidden">
                                <img src="${coverImage}" alt="${exercise.name}" class="w-full h-full object-cover" onerror="this.style.display='none'">
                            </div>
                        ` : ''}
                        <div class="p-4 cursor-pointer hover:bg-gray-50 transition-colors" onclick="toggleDetails('${exercise.id}')">
                            <div class="flex items-start justify-between">
                                <div class="flex-1">
                                    <h3 class="font-semibold text-gray-800">${exercise.name}</h3>
                                    <p class="text-sm text-gray-500 mt-1">
                                        <span class="inline-block bg-gray-100 px-2 py-0.5 rounded mr-2">
                                            ${exercise.exercise_type || '未分类'}
                                        </span>
                                        <span class="inline-block bg-gray-100 px-2 py-0.5 rounded">
                                            ${exercise.body_category || '未分类'}
                                        </span>
                                        ${hasTutorial ? '<span class="inline-block bg-blue-100 text-blue-700 px-2 py-0.5 rounded ml-2"><i class="fas fa-book mr-1"></i>有教程</span>' : ''}
                                        ${coverImage ? '<span class="inline-block bg-purple-100 text-purple-700 px-2 py-0.5 rounded ml-2"><i class="fas fa-image mr-1"></i>有封面</span>' : ''}
                                    </p>
                                </div>
                                <div class="flex items-center gap-2">
                                    <div class="status-badge ${hasIssues ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'} px-3 py-1 rounded-full text-sm font-medium">
                                        ${hasIssues ? `<i class="fas fa-exclamation-triangle mr-1"></i>${issues.length} 个问题` : '<i class="fas fa-check mr-1"></i>正常'}
                                    </div>
                                    <i class="fas fa-chevron-down text-gray-400 transition-transform" id="chevron-${exercise.id}"></i>
                                </div>
                            </div>
                            
                            <div class="mt-3 grid grid-cols-2 gap-2 text-sm">
                                <div>
                                    <span class="text-gray-500">难度:</span>
                                    <span class="font-medium ml-1">${exercise.difficulty || '未设置'}</span>
                                </div>
                                <div>
                                    <span class="text-gray-500">设备:</span>
                                    <span class="font-medium ml-1">${exercise.equipment_required?.join(', ') || '未设置'}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="details-section hidden" id="details-${exercise.id}">
                            <div class="border-t border-gray-200 p-4 bg-gray-50">
                                ${hasIssues ? `
                                    <div class="mb-4">
                                        <h4 class="font-semibold text-red-700 mb-2"><i class="fas fa-exclamation-triangle mr-1"></i>检测到的问题</h4>
                                        <div class="space-y-2">
                                            ${issues.map(issue => `
                                                <div class="field-item issue rounded px-3 py-2 text-sm bg-white border border-red-200">
                                                    <div class="font-medium text-red-700">${issue.field}</div>
                                                    <div class="text-gray-600">${issue.message}</div>
                                                </div>
                                            `).join('')}
                                        </div>
                                        <button onclick="event.stopPropagation(); fixSingleExercise('${exercise.id}')" class="w-full mt-3 bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                            <i class="fas fa-wand-magic-sparkles mr-1"></i>修复此运动
                                        </button>
                                    </div>
                                ` : `
                                    <div class="mb-4 p-3 bg-green-50 border border-green-200 rounded">
                                        <div class="text-green-700 font-medium"><i class="fas fa-check-circle mr-1"></i>数据完整</div>
                                    </div>
                                `}
                                
                                <div class="mb-4">
                                    <h4 class="font-semibold text-gray-700 mb-2">修复结果</h4>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
                                        <div>
                                            <span class="text-gray-500">分类:</span>
                                            <span class="font-medium ml-1">${exercise.category || '未设置'}</span>
                                        </div>
                                        <div>
                                            <span class="text-gray-500">主要肌肉群:</span>
                                            <span class="font-medium ml-1">${exercise.muscle_groups?.primary?.join(', ') || '未设置'}</span>
                                        </div>
                                        <div>
                                            <span class="text-gray-500">次要肌肉群:</span>
                                            <span class="font-medium ml-1">${exercise.muscle_groups?.secondary?.join(', ') || '未设置'}</span>
                                        </div>
                                        <div>
                                            <span class="text-gray-500">稳定肌群:</span>
                                            <span class="font-medium ml-1">${exercise.muscle_groups?.stabilizers?.join(', ') || '未设置'}</span>
                                        </div>
                                    </div>
                                </div>
                                
                                ${exercise.content_html ? `
                                    <div class="mb-4">
                                        <h4 class="font-semibold text-gray-700 mb-2">运动说明</h4>
                                        <div class="bg-white border border-gray-200 rounded p-3 max-h-64 overflow-y-auto prose prose-sm">
                                            ${exercise.content_html}
                                        </div>
                                    </div>
                                ` : ''}
                                
                                ${hasTutorial ? `
                                    <div class="mb-4">
                                        <h4 class="font-semibold text-gray-700 mb-2">动作教程</h4>
                                        <div class="bg-white border border-gray-200 rounded p-3 max-h-64 overflow-y-auto markdown-content">
                                            ${marked.parse(exercise.tutorial_html)}
                                        </div>
                                    </div>
                                ` : ''}
                                
                                <div class="flex gap-2">
                                    <button onclick="event.stopPropagation(); generateTutorialFor('${exercise.id}')" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                        <i class="fas fa-book mr-1"></i>生成教程
                                    </button>
                                    ${hasTutorial ? `
                                        <button onclick="event.stopPropagation(); removeTutorial('${exercise.id}')" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                            <i class="fas fa-trash mr-1"></i>删除教程
                                        </button>
                                    ` : ''}
                                    <button onclick="event.stopPropagation(); generateCoverImageFor('${exercise.id}')" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                        <i class="fas fa-image mr-1"></i>生成封面
                                    </button>
                                    <button onclick="event.stopPropagation(); deleteExercise('${exercise.id}')" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                        <i class="fas fa-trash-alt mr-1"></i>删除
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
