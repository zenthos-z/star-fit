version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=43111
      - HOST=0.0.0.0
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - APP_ORIGIN=${APP_ORIGIN}
    ports:
      - "43111:43111"
    restart: unless-stopped
  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - backend
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped
