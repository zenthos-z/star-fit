user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;
  sendfile        on;
  keepalive_timeout  65;
  gzip on;

  upstream backend {
    server backend:43111;
  }

  server {
    listen 80;
    server_name _;

    # SSE 链路（/api/chat）：关闭缓冲，避免流式输出被攒包
    location /api/ {
      proxy_pass http://backend;   # 保留 /api 前缀，后端本来就挂在 /api 下
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket（/api/ws/sync、/api/videos/progress）
    location ~* ^/api/(ws/|videos/progress) {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 媒体文件（上传的视频可能较大）
    client_max_body_size 200m;

    # /healthz 与后端根级探针一致（2026-09-18）：免令牌、双通道一致。
    # 旧版代理到 /api/ping，带鉴权部署时前端探测必 401（调试功能 ping 不通的根因之一）。
    location /healthz {
      proxy_pass http://backend/healthz;
      proxy_set_header Host $host;
    }
  }
}
